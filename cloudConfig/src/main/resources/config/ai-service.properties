eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

spring.data.mongodb.uri=mongodb://localhost:27017/fitness_ai_db
spring.data.mongodb.database=ai_recommendation_db


server.port=8083
spring.jpa.hibernate.ddl-auto=update


# For ai-service
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false


rabbit.mq.exchange.name=fitness_exchange
rabbit.mq.queue.message=activity_to_ai_queue
rabbit.mq.routing.key.message=activity.routing.key
